name: CI

on:
  push:
    branches: 
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name : checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: python -m pytest

      - name: build docker image
        run: docker build -t my-logscope-app .

      - name: run docker container
        run: docker run --rm my-logscope-app

      - name: check docker hub credentials
        if: github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "dockerhub username is available"
          echo "dockerhub token is available"

      - name: login to dockerhub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: tag docker image
        if: github.ref == 'refs/heads/main'
        run: docker tag my-logscope-app:latest sohail4hmed/logscope:latest

      - name: push docker image
        if: github.ref == 'refs/heads/main'
        run: docker push sohail4hmed/logscope:latest      
